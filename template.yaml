AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Minimal ContextLens hackathon backend

Parameters:
  FrontendOrigin:
    Type: String
    Description: Exact frontend origin allowed by API Gateway and S3 CORS
    Default: http://localhost:5173
  GeminiSecretArn:
    Type: String
    Description: Optional Secrets Manager ARN containing GEMINI_API_KEY or the raw key
    Default: ''
  MaxUploadBytes:
    Type: Number
    Default: 262144000
  AnalysisTtlSeconds:
    Type: Number
    Default: 172800

Conditions:
  HasGeminiSecret: !Not [!Equals [!Ref GeminiSecretArn, '']]

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        UPLOAD_BUCKET: !Ref UploadBucket
        ANALYSIS_TABLE: !Ref AnalysisTable
        MAX_UPLOAD_BYTES: !Ref MaxUploadBytes
        ANALYSIS_TTL_SECONDS: !Ref AnalysisTtlSeconds

Resources:
  ContextLensApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        MaxAge: 600

  UploadBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref FrontendOrigin
            AllowedMethods:
              - PUT
              - HEAD
            AllowedHeaders:
              - Content-Type
              - x-amz-server-side-encryption
            ExposedHeaders:
              - ETag
            MaxAge: 600
      LifecycleConfiguration:
        Rules:
          - Id: DeleteDemoUploads
            Status: Enabled
            ExpirationInDays: 2
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  AnalysisTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: analysis_id
          AttributeType: S
      KeySchema:
        - AttributeName: analysis_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  AnalysisDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  AnalysisQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 5400
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AnalysisDeadLetterQueue.Arn
        maxReceiveCount: 2

  CreateAnalysisFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: backend/
      Handler: handlers.create_analysis.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Environment:
        Variables:
          ANALYSIS_QUEUE_URL: !Ref AnalysisQueue
          UPLOAD_URL_TTL_SECONDS: 900
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref UploadBucket
        - S3WritePolicy:
            BucketName: !Ref UploadBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysisTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt AnalysisQueue.QueueName
      Events:
        CreateAnalysis:
          Type: HttpApi
          Properties:
            ApiId: !Ref ContextLensApi
            Path: /analyses
            Method: POST
        CompleteAnalysis:
          Type: HttpApi
          Properties:
            ApiId: !Ref ContextLensApi
            Path: /analyses/{analysis_id}/complete
            Method: POST

  GetAnalysisFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: backend/
      Handler: handlers.get_analysis.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AnalysisTable
      Events:
        GetAnalysis:
          Type: HttpApi
          Properties:
            ApiId: !Ref ContextLensApi
            Path: /analyses/{analysis_id}
            Method: GET

  AnalysisWorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: backend/
      DockerTag: contextlens-worker
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      Timeout: 900
      MemorySize: 3008
      EphemeralStorage:
        Size: 8192
      Environment:
        Variables:
          GEMINI_SECRET_ARN: !Ref GeminiSecretArn
          WHISPER_MODEL_PATH: /opt/models/faster-whisper-small
          WHISPER_DEVICE: cpu
          WHISPER_COMPUTE_TYPE: int8
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref UploadBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysisTable
        - SQSPollerPolicy:
            QueueName: !GetAtt AnalysisQueue.QueueName
        - !If
          - HasGeminiSecret
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref GeminiSecretArn
          - !Ref AWS::NoValue
      Events:
        AnalysisJobs:
          Type: SQS
          Properties:
            Queue: !GetAtt AnalysisQueue.Arn
            BatchSize: 1
            ScalingConfig:
              MaximumConcurrency: 2
            FunctionResponseTypes:
              - ReportBatchItemFailures

  CreateAnalysisLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CreateAnalysisFunction}
      RetentionInDays: 7

  GetAnalysisLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${GetAnalysisFunction}
      RetentionInDays: 7

  AnalysisWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AnalysisWorkerFunction}
      RetentionInDays: 7

Outputs:
  ApiBaseUrl:
    Value: !Sub https://${ContextLensApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  UploadBucketName:
    Value: !Ref UploadBucket
  AnalysisTableName:
    Value: !Ref AnalysisTable
  AnalysisQueueUrl:
    Value: !Ref AnalysisQueue
